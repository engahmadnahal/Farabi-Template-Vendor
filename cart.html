<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Shopping Cart - Farabi Academy">
  <title>Shopping Cart - Farabi Academy</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="theme/assets/css/main.css">
  
  <!-- Tailwind Config for Custom Colors -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            pistachio: '#93c572',
            'pistachio-dark': '#7db157',
            navy: '#1e3a5f',
            'navy-dark': '#152a45',
          }
        }
      }
    }
  </script>
</head>
<body class="min-h-screen bg-gray-50 dark:bg-gray-900">
  <!-- Back Button -->
  <div class="bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
      <button
        onclick="window.history.back()"
        class="flex items-center gap-2 text-gray-700 dark:text-gray-300 hover:text-pistachio dark:hover:text-pistachio transition-colors"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                    </svg>
        <span>رجوع</span>
      </button>
                </div>
            </div>
            
  <!-- Main Content -->
  <main class="py-8">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <h1 class="text-3xl md:text-4xl font-bold text-gray-900 dark:text-white mb-8">سلة التسوق</h1>
      
      <div class="flex flex-col lg:flex-row gap-8">
        <!-- Cart Items -->
        <div class="lg:w-2/3">
          <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-lg p-6">
            <h2 class="text-xl font-bold text-gray-900 dark:text-white mb-6">الكورسات المضافة</h2>
            
            <!-- Cart Items Container -->
            <div id="cartItems" class="space-y-4">
              <!-- Cart items will be dynamically inserted here -->
            </div>

            <!-- Empty Cart Message -->
            <div id="emptyCart" class="hidden text-center py-12">
              <svg class="w-24 h-24 mx-auto text-gray-400 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
                                            </svg>
              <p class="text-xl text-gray-600 dark:text-gray-400 mb-4">السلة فارغة</p>
              <a href="courses.html" class="inline-block px-6 py-3 bg-pistachio text-white rounded-full hover:bg-pistachio-dark transition-all">
                تصفح الكورسات
              </a>
                                    </div>
                                </div>
                            </div>

        <!-- Order Summary -->
        <div class="lg:w-1/3">
          <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-lg p-6 sticky top-24">
            <h2 class="text-xl font-bold text-gray-900 dark:text-white mb-6">ملخص الطلب</h2>
            
            <!-- Price Breakdown -->
            <div class="space-y-4 mb-6">
              <div class="flex justify-between text-gray-700 dark:text-gray-300">
                <span>المجموع الفرعي</span>
                <span id="subtotal">$0</span>
              </div>
              
              <!-- Coupon Section -->
              <div class="border-t border-gray-200 dark:border-gray-700 pt-4">
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">كود الخصم</label>
                <div class="flex gap-2">
                  <input
                    type="text"
                    id="couponCode"
                    placeholder="أدخل الكود"
                    class="flex-1 px-4 py-2 rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-pistachio focus:border-transparent transition-all"
                  />
                  <button
                    id="applyCoupon"
                    class="px-6 py-2 bg-pistachio text-white rounded-xl hover:bg-pistachio-dark transition-all"
                  >
                    تطبيق
                                        </button>
                                    </div>
                <div id="couponMessage" class="mt-2 text-sm"></div>
              </div>
              
              <div class="flex justify-between text-gray-700 dark:text-gray-300" id="discountRow" style="display: none;">
                <span class="text-pistachio">الخصم</span>
                <span class="text-pistachio" id="discount">-$0</span>
                                </div>
              
              <div class="border-t border-gray-200 dark:border-gray-700 pt-4">
                <div class="flex justify-between text-lg font-bold text-gray-900 dark:text-white">
                  <span>المجموع الكلي</span>
                  <span id="total">$0</span>
                            </div>
                        </div>
                    </div>

            <!-- Payment Methods -->
            <div class="mb-6">
              <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-3">طريقة الدفع</label>
              <div class="space-y-2">
                <label class="flex items-center p-3 border-2 border-gray-200 dark:border-gray-700 rounded-xl cursor-pointer hover:border-pistachio transition-all payment-method">
                  <input type="radio" name="paymentMethod" value="credit-card" class="w-4 h-4 text-pistachio border-gray-300 focus:ring-pistachio" checked>
                  <div class="ml-3 flex-1">
                    <div class="font-medium text-gray-900 dark:text-white">بطاقة ائتمانية</div>
                    <div class="text-sm text-gray-500 dark:text-gray-400">Visa, Mastercard, Amex</div>
                        </div>
                  <svg class="w-6 h-6 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" />
                  </svg>
                </label>
                
                <label class="flex items-center p-3 border-2 border-gray-200 dark:border-gray-700 rounded-xl cursor-pointer hover:border-pistachio transition-all payment-method">
                  <input type="radio" name="paymentMethod" value="paypal" class="w-4 h-4 text-pistachio border-gray-300 focus:ring-pistachio">
                  <div class="ml-3 flex-1">
                    <div class="font-medium text-gray-900 dark:text-white">PayPal</div>
                    <div class="text-sm text-gray-500 dark:text-gray-400">الدفع عبر PayPal</div>
                                </div>
                  <svg class="w-6 h-6 text-blue-500" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M7.076 21.337H2.47a.641.641 0 0 1-.633-.74L4.944.901C5.026.382 5.474 0 5.998 0h7.46c2.57 0 4.578.543 5.69 1.81 1.174 1.305 1.06 3.1.927 4.715-.016.192-.03.384-.041.567-.121 1.58-.282 3.642-.895 5.358-1.537 4.48-5.64 7.012-9.555 7.012H9.806a.696.696 0 0 1-.664-.48l-2.066-6.302z"/>
                  </svg>
                </label>
                
                <label class="flex items-center p-3 border-2 border-gray-200 dark:border-gray-700 rounded-xl cursor-pointer hover:border-pistachio transition-all payment-method">
                  <input type="radio" name="paymentMethod" value="bank-transfer" class="w-4 h-4 text-pistachio border-gray-300 focus:ring-pistachio">
                  <div class="ml-3 flex-1">
                    <div class="font-medium text-gray-900 dark:text-white">تحويل بنكي</div>
                    <div class="text-sm text-gray-500 dark:text-gray-400">تحويل مباشر من البنك</div>
                                </div>
                  <svg class="w-6 h-6 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
                  </svg>
                </label>
                                </div>
                            </div>

            <!-- Checkout Button -->
            <button
              id="checkoutBtn"
              class="w-full py-4 bg-gradient-to-r from-pistachio to-green-600 text-white rounded-xl hover:from-green-600 hover:to-pistachio transition-all hover:shadow-lg transform hover:scale-[1.02] font-semibold text-lg"
            >
              إتمام الطلب
            </button>
            
            <p class="text-xs text-gray-500 dark:text-gray-400 text-center mt-4">
              بالضغط على "إتمام الطلب"، أنت توافق على شروط وأحكام الاستخدام
            </p>
                                </div>
                            </div>
                        </div>
                    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-navy dark:bg-gray-950 text-white py-6 mt-12">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
      <p class="text-gray-300">
        Powered by <span class="font-bold text-pistachio">Farabi Academy</span>
      </p>
                </div>
  </footer>

  <!-- Scripts -->
  <script src="theme/assets/js/utils.js"></script>
  <script src="theme/assets/js/app.js"></script>
  
  <script>
    // Sample cart data (in real app, this would come from localStorage or API)
    let cartItems = [
      {
        id: 1,
        title: "Web Development Mastery",
        price: 299,
        image: "https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=800&q=80",
        category: "web-development"
      },
      {
        id: 3,
        title: "Graphic Design Fundamentals",
        price: 199,
        image: "https://images.unsplash.com/photo-1626785774573-4b799315345d?w=800&q=80",
        category: "graphic-design"
      }
    ];

    let discount = 0;
    let discountPercentage = 0;

    // Available coupons
    const coupons = {
      'WELCOME10': 10,
      'STUDENT20': 20,
      'SUMMER30': 30
    };

    // Render cart items
    function renderCartItems() {
      const container = document.getElementById('cartItems');
      const emptyCart = document.getElementById('emptyCart');
      
      if (cartItems.length === 0) {
        container.classList.add('hidden');
        emptyCart.classList.remove('hidden');
        updateTotals();
        return;
      }

      container.classList.remove('hidden');
      emptyCart.classList.add('hidden');

      container.innerHTML = cartItems.map(item => `
        <div class="flex gap-4 p-4 border border-gray-200 dark:border-gray-700 rounded-xl hover:shadow-md transition-all" data-item-id="${item.id}">
          <img
            src="${item.image}"
            alt="${item.title}"
            class="w-24 h-24 object-cover rounded-lg"
            loading="lazy"
          />
          <div class="flex-1">
            <h3 class="font-bold text-gray-900 dark:text-white mb-1">${item.title}</h3>
            <p class="text-sm text-gray-600 dark:text-gray-400 mb-2">${item.category.replace('-', ' ')}</p>
            <div class="flex items-center justify-between">
              <span class="text-lg font-bold text-pistachio">$${item.price}</span>
              <button
                onclick="removeFromCart(${item.id})"
                class="text-red-500 hover:text-red-700 transition-colors"
                aria-label="Remove item"
              >
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
              </button>
            </div>
          </div>
    </div>
      `).join('');

      updateTotals();
    }

    // Update totals
    function updateTotals() {
      const subtotal = cartItems.reduce((sum, item) => sum + item.price, 0);
      const discountAmount = (subtotal * discountPercentage) / 100;
      const total = subtotal - discountAmount;

      document.getElementById('subtotal').textContent = `$${subtotal.toFixed(2)}`;
      
      if (discountAmount > 0) {
        document.getElementById('discountRow').style.display = 'flex';
        document.getElementById('discount').textContent = `-$${discountAmount.toFixed(2)}`;
      } else {
        document.getElementById('discountRow').style.display = 'none';
      }
      
      document.getElementById('total').textContent = `$${total.toFixed(2)}`;
    }

    // Remove item from cart
    function removeFromCart(itemId) {
      cartItems = cartItems.filter(item => item.id !== itemId);
      renderCartItems();
      
      // In real app, update localStorage or send to server
      // localStorage.setItem('cart', JSON.stringify(cartItems));
    }

    // Apply coupon
    document.getElementById('applyCoupon').addEventListener('click', () => {
      const code = document.getElementById('couponCode').value.toUpperCase().trim();
      const messageDiv = document.getElementById('couponMessage');
      
      if (coupons[code]) {
        discountPercentage = coupons[code];
        messageDiv.innerHTML = `<span class="text-green-600 dark:text-green-400">✓ تم تطبيق الخصم ${discountPercentage}%</span>`;
        updateTotals();
      } else {
        discountPercentage = 0;
        messageDiv.innerHTML = `<span class="text-red-600 dark:text-red-400">كود خصم غير صحيح</span>`;
        updateTotals();
      }
    });

    // Payment method selection
    document.querySelectorAll('.payment-method').forEach(label => {
      label.addEventListener('click', () => {
        document.querySelectorAll('.payment-method').forEach(l => {
          l.classList.remove('border-pistachio');
          l.classList.add('border-gray-200', 'dark:border-gray-700');
        });
        label.classList.add('border-pistachio');
        label.classList.remove('border-gray-200', 'dark:border-gray-700');
      });
    });

    // Checkout
    document.getElementById('checkoutBtn').addEventListener('click', () => {
      if (cartItems.length === 0) {
        alert('السلة فارغة');
        return;
      }

      const paymentMethod = document.querySelector('input[name="paymentMethod"]:checked').value;
      const total = parseFloat(document.getElementById('total').textContent.replace('$', ''));
      
      // In real app, this would redirect to payment gateway
      alert(`سيتم توجيهك إلى صفحة الدفع\nطريقة الدفع: ${paymentMethod}\nالمبلغ: $${total.toFixed(2)}`);
      
      // Example redirect (uncomment in real app):
      // window.location.href = `checkout.html?method=${paymentMethod}&total=${total}`;
    });

    // Load cart from localStorage on page load (if exists)
    window.addEventListener('DOMContentLoaded', () => {
      // In real app, load from localStorage:
      // const savedCart = localStorage.getItem('cart');
      // if (savedCart) {
      //   cartItems = JSON.parse(savedCart);
      // }
      renderCartItems();
    });

    // Make removeFromCart available globally
    window.removeFromCart = removeFromCart;
    </script>

  <style>
    .payment-method input[type="radio"]:checked + div {
      color: inherit;
    }
    
    .payment-method:has(input[type="radio"]:checked) {
      border-color: #93c572;
    }
  </style>
</body>
</html>
