<!DOCTYPE html>
<html lang="en" dir="ltr" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Farabi Academy</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect width="40" height="40" rx="10" fill="url(#farabiGradient)"/>
                        <defs>
                            <linearGradient id="farabiGradient" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
                                <stop stop-color="#A8D5BA"/>
                                <stop offset="1" stop-color="#1E3A5F"/>
                            </linearGradient>
                        </defs>
                        <path d="M20 12L26 18L20 24M14 18H26" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <circle cx="20" cy="20" r="18" stroke="white" stroke-width="1.5" stroke-opacity="0.3"/>
                    </svg>
                    <span class="logo-text">Farabi Academy</span>
                </div>
            </div>
            
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <path d="M2.5 10L9.16667 3.33333L9.16667 8.33333L17.5 8.33333L17.5 11.6667L9.16667 11.6667L9.16667 16.6667L2.5 10Z" fill="currentColor"/>
                    </svg>
                    <span>Dashboard</span>
                </a>
                <a href="courses.html" class="nav-item">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <path d="M2.5 5.83333L10 2.5L17.5 5.83333V15L10 17.5L2.5 15V5.83333Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M10 2.5V17.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M2.5 5.83333L10 9.16667L17.5 5.83333" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span>Courses</span>
                </a>
                <a href="students.html" class="nav-item">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <path d="M10 10C12.7614 10 15 7.76142 15 5C15 2.23858 12.7614 0 10 0C7.23858 0 5 2.23858 5 5C5 7.76142 7.23858 10 10 10Z" fill="currentColor"/>
                        <path d="M10 12.5C6.66667 12.5 0 14.175 0 17.5V20H20V17.5C20 14.175 13.3333 12.5 10 12.5Z" fill="currentColor"/>
                    </svg>
                    <span>Students</span>
                </a>
                <a href="analytics.html" class="nav-item">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <path d="M2.5 15L7.5 10L11.25 13.75L17.5 7.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M12.5 7.5H17.5V12.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span>Analytics</span>
                </a>
                <a href="settings.html" class="nav-item active">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <path d="M10 12.5C11.3807 12.5 12.5 11.3807 12.5 10C12.5 8.61929 11.3807 7.5 10 7.5C8.61929 7.5 7.5 8.61929 7.5 10C7.5 11.3807 8.61929 12.5 10 12.5Z" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M16.25 10C16.25 10.4167 16.2917 10.8333 16.375 11.25L17.875 12.0833C18.1667 12.25 18.3333 12.5833 18.2917 12.9167L18.0833 14.75C18.0417 15.0833 17.7917 15.3333 17.4583 15.375L15.625 15.5833C15.2083 15.6667 14.8333 15.875 14.5417 16.1667L13.7083 17.6667C13.5417 17.9583 13.2083 18.125 12.875 18.0833L11.0417 17.875C10.625 17.7917 10.2083 17.7917 9.79167 17.875L7.95833 18.0833C7.625 18.125 7.29167 17.9583 7.125 17.6667L6.29167 16.1667C6 15.875 5.625 15.6667 5.20833 15.5833L3.375 15.375C3.04167 15.3333 2.79167 15.0833 2.75 14.75L2.54167 12.9167C2.5 12.5833 2.66667 12.25 2.95833 12.0833L4.45833 11.25C4.54167 10.8333 4.58333 10.4167 4.58333 10C4.58333 9.58333 4.54167 9.16667 4.45833 8.75L2.95833 7.91667C2.66667 7.75 2.5 7.41667 2.54167 7.08333L2.75 5.25C2.79167 4.91667 3.04167 4.66667 3.375 4.625L5.20833 4.41667C5.625 4.33333 6 4.125 6.29167 3.83333L7.125 2.33333C7.29167 2.04167 7.625 1.875 7.95833 1.91667L9.79167 2.125C10.2083 2.20833 10.625 2.20833 11.0417 2.125L12.875 1.91667C13.2083 1.875 13.5417 2.04167 13.7083 2.33333L14.5417 3.83333C14.8333 4.125 15.2083 4.33333 15.625 4.41667L17.4583 4.625C17.7917 4.66667 18.0417 4.91667 18.0833 5.25L18.2917 7.08333C18.3333 7.41667 18.1667 7.75 17.875 7.91667L16.375 8.75C16.2917 9.16667 16.25 9.58333 16.25 10Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span>Settings</span>
                </a>
            </nav>
            
            <div class="sidebar-footer">
                <div class="user-profile">
                    <div class="user-avatar">
                        <img src="https://ui-avatars.com/api/?name=Admin+User&background=A8D5BA&color=1E3A5F" alt="User">
                    </div>
                    <div class="user-info">
                        <div class="user-name">Admin User</div>
                        <div class="user-role">Administrator</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Bar -->
            <header class="topbar">
                <div class="topbar-left">
                    <h1 class="page-title">Settings</h1>
                    <p class="page-subtitle">Configure your LMS preferences</p>
                </div>
                <div class="topbar-right">
                    <div class="language-switcher">
                        <button class="active" onclick="switchLanguage('en')">EN</button>
                        <span class="divider"></span>
                        <button onclick="switchLanguage('ar')">AR</button>
                    </div>
                    <button class="icon-button cart-icon">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                            <path d="M5 5H15L14.1667 13.3333H5.83333L5 5Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M5 5L3.33333 2.5H1.66667" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                            <circle cx="7.5" cy="17.5" r="1.25" fill="currentColor"/>
                            <circle cx="13.75" cy="17.5" r="1.25" fill="currentColor"/>
                        </svg>
                        <span class="cart-badge">2</span>
                    </button>
                    <button class="icon-button">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                            <path d="M10 2.5V5M10 15V17.5M17.5 10H15M5 10H2.5M15.3033 4.69667L13.5355 6.46447M6.46447 13.5355L4.69667 15.3033M15.3033 15.3033L13.5355 13.5355M6.46447 6.46447L4.69667 4.69667" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                        </svg>
                    </button>
                    <div class="notifications">
                        <button class="icon-button notification-btn">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <path d="M10 2.5C7.23858 2.5 5 4.73858 5 7.5V11.25L3.33333 12.9167V14.1667H16.6667V12.9167L15 11.25V7.5C15 4.73858 12.7614 2.5 10 2.5Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M8.33333 14.1667V15.8333C8.33333 16.7538 9.07952 17.5 10 17.5C10.9205 17.5 11.6667 16.7538 11.6667 15.8333V14.1667" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                            <span class="notification-badge">3</span>
                        </button>
                    </div>
                </div>
            </header>

            <!-- Content Area -->
            <div class="content-area">
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">General Settings</h3>
                    </div>
                    <div class="card-body">
                        <div style="display: flex; flex-direction: column; gap: 24px;">
                            <div>
                                <label style="display: block; font-weight: 600; margin-bottom: 8px; color: var(--text-primary);">Platform Name</label>
                                <input type="text" value="Farabi LMS" class="select-input" style="width: 100%; max-width: 400px;">
                            </div>
                            <div>
                                <label style="display: block; font-weight: 600; margin-bottom: 8px; color: var(--text-primary);">Email Notifications</label>
                                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                                    <input type="checkbox" checked>
                                    <span>Enable email notifications for new enrollments</span>
                                </label>
                            </div>
                            <div>
                                <label style="display: block; font-weight: 600; margin-bottom: 8px; color: var(--text-primary);">Default Currency</label>
                                <select class="select-input" style="width: 100%; max-width: 200px;">
                                    <option>USD ($)</option>
                                    <option>EUR (€)</option>
                                    <option>GBP (£)</option>
                                </select>
                            </div>
                            <div>
                                <button class="btn-secondary" style="background: linear-gradient(135deg, #6366F1 0%, #8B5CF6 100%); color: white; border: none; width: auto; padding: 12px 24px;">Save Changes</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
    <script src="language-switcher.js"></script>
</body>
</html>
